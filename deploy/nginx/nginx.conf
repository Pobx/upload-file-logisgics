user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream fe_pool {
        least_conn;
        server fe-1:80 max_fails=3 fail_timeout=10s;
        server fe-2:80 max_fails=3 fail_timeout=10s;
        server fe-3:80 max_fails=3 fail_timeout=10s;
    }

    upstream be_pool {
        least_conn;
        server be-1:8080 max_fails=3 fail_timeout=10s;
        server be-2:8080 max_fails=3 fail_timeout=10s;
        server be-3:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 55m;

        # Standard error pages in JSON envelope format (SPEC 9)
        error_page 502 /502.json;
        error_page 503 /503.json;
        error_page 504 /504.json;

        location = /502.json {
            return 502 '{"code":"5020","message":"Bad Gateway: backend service is unreachable","data":null}';
            add_header Content-Type application/json always;
        }
        location = /503.json {
            return 503 '{"code":"5030","message":"Service Unavailable: backend is temporarily down","data":null}';
            add_header Content-Type application/json always;
            add_header Retry-After 5 always;
        }
        location = /504.json {
            return 504 '{"code":"5040","message":"Gateway Timeout","data":null}';
            add_header Content-Type application/json always;
        }

        # API & Download Proxy
        location /api/ {
            proxy_pass http://be_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Resilience rules: Do NOT retry 503 from backend (prevents DB storm) and do NOT retry POST
            proxy_next_upstream error timeout http_502;
            proxy_request_buffering off; # Direct streaming for upload
            proxy_read_timeout 120s;
        }

        # Keycloak Proxy
        location /auth/ {
            proxy_pass http://keycloak:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Static SPA Proxy
        location / {
            proxy_pass http://fe_pool;
            proxy_set_header Host $host;
        }
    }
}
