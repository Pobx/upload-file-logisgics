services:
  nginx:
    image: nginx:alpine
    container_name: docsearch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fe-1
      - fe-2
      - fe-3
      - be-1
      - be-2
      - be-3
    deploy:
      resources:
        limits:
          memory: 64M

  fe-1:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  fe-2:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  fe-3:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32M

  be-1:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ENV: production
      DATABASE_URL: postgres://docsearch:docsearch_password@postgres:5432/docsearch_app?sslmode=disable
      RUN_WORKERS: "false"
      GOMEMLIMIT: "150MiB"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M

  be-2:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ENV: production
      DATABASE_URL: postgres://docsearch:docsearch_password@postgres:5432/docsearch_app?sslmode=disable
      RUN_WORKERS: "false"
      GOMEMLIMIT: "150MiB"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M

  be-3:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ENV: production
      DATABASE_URL: postgres://docsearch:docsearch_password@postgres:5432/docsearch_app?sslmode=disable
      RUN_WORKERS: "false"
      GOMEMLIMIT: "150MiB"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/app/worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://docsearch:docsearch_password@postgres:5432/docsearch_app?sslmode=disable
      GOMEMLIMIT: "150MiB"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M

  postgres:
    image: postgres:16-alpine
    container_name: docsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsearch
      POSTGRES_PASSWORD: docsearch_password
      POSTGRES_DB: docsearch_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
               -c max_connections=200
               -c shared_buffers=768MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsearch -d docsearch_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: docsearch-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../apps/api/db/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://docsearch:docsearch_password@postgres:5432/docsearch_app?sslmode=disable
      - up
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: docsearch-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_OPTS_APPEND: "-XX:UseSVE=0"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/docsearch_app
      KC_DB_USERNAME: docsearch
      KC_DB_PASSWORD: docsearch_password
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: docsearch-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
